# simple-cdd configuration for Anartz OS installable ISO
profiles="anartz"
profile_dir="simple-cdd/profiles"
mirror_components="main contrib non-free non-free-firmware"
use_security_mirror=true

# Mirrors (consistent with build-iso.sh / auto/config)
debian_mirror="http://deb.debian.org/debian"
security_mirror="http://security.debian.org/debian-security"

# Keep naming and branding consistent in installer menu where possible
custom_installer="true"
